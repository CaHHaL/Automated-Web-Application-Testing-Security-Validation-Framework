[pytest]
testpaths = tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = reports/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    api: API endpoint tests using the Requests library
    ui: Browser-based UI tests using Playwright
    security: Security validation tests (authorized environments only)
    regression: Regression tests to verify existing functionality after changes
    functional: Functional tests validating application behaviour
    negative: Negative tests using invalid or unexpected input
    boundary: Boundary-value tests at the limits of accepted input
    positive: Positive tests using valid, expected input
    smoke: Smoke tests — quick sanity checks

addopts =
    --tb=short
    --strict-markers
    -v
